# NNT branch only: builds branch nnt and deploys it to the `proscenium` Worker on the New Theatre
# Cloudflare account (newtheatre.org.uk). Workers Builds there cannot reach this repository, so the
# deploy runs here instead. Needs the repository secret CLOUDFLARE_API_TOKEN: a token on the New Theatre
# account with Workers Scripts, D1, Workers KV Storage, Workers R2 Storage and Queues (all Edit) and
# Account Settings (Read). The preview still deploys through Workers Builds from branch nnt-preview.
name: Deploy NNT

on:
  push:
    branches: [nnt]
  workflow_dispatch:

concurrency:
  group: deploy-nnt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/nnt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3d250a94794003bd921b7f0379de7f00
