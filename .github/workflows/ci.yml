name: CI

on:
  pull_request:
  push:
    branches: [main, unified/main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which typecheck, lint and build all need.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # tests/, scripts/ and migration/ run under Bun, so Nuxt's typecheck does not see them.
      - name: Typecheck (Bun projects)
        run: bun run typecheck:bun

      # Unit and integration only, in under a second. The end-to-end suites need a dev server and
      # a browser, and run in their own workflow (0029).
      - name: Tests
        run: bun run test

      - name: Comments
        run: bun run check:comments

      # A generated rebuild of an append-only table, or one that drops a cascade or a
      # trigger the snapshot cannot re-emit (invariant 0010).
      - name: Migrations
        run: bun run check:migrations

      # A policy page quoting a configuration key that does not exist would publish a rule
      # the write path does not enforce (0012).
      - name: Content tokens
        run: bun run check:content-tokens

      # A money path that writes the ledger itself is a path that can forget to (0004).
      - name: Ledger
        run: bun run check:ledger

      # Anything but the notification centre reaching the mail binding skips every rule the
      # centre enforces (0013).
      - name: Notifications
        run: bun run check:notifications

      # A privileged mutation that records nothing is a gap nobody sees until it matters
      # (J-101 criterion 5).
      - name: Audit coverage
        run: bun run check:audit
