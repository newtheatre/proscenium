# Every pull request and every push to next and main: lint, types, conformance, the three test
# tiers and a production build. Linux only, the supported system for tests. No secrets are used.
name: CI

on:
  pull_request:
  push:
    branches: [next, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the migration check compares with the newest release tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:conformance
      # Import cycles, duplication, type coverage and ignore comments may not get worse than metrics.json.
      - run: bun run metrics
      # No file, dependency or import that nothing uses (knip.json teaches it the registry's conventions).
      - run: bun run check:unused

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Coverage may not fall below the thresholds in vitest.config.ts.
      - run: bun run test:coverage

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The interface's browser tests need the gallery fixture module, which only this build includes.
      - run: bun run build
        env:
          PROSCENIUM_GALLERY: '1'
      # The Worker and browser bundles, compared with metrics.json (5% growth allowed per change).
      - run: bun run metrics worker
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
