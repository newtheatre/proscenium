name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, needed by typecheck/lint/build.
      # GH_PACKAGES_TOKEN reads @newtheatre/auth-types from GitHub Packages (ADR-0025).
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      # Typecheck and lint are hard gates: the codebase is clean.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Comments
        run: bun run check:comments

      # A new users.id reference that skipped the estate hooks (ADR-0025).
      - name: User references
        run: bun run check:user-refs

      # Training mode reaching an operational table (ADR-0032). The guarantee
      # is meant to be checkable, not reviewable, so this is the check.
      - name: Training isolation
        run: bun run check:training

      # A generated table rebuild silently deleting rows that cascade onto it,
      # which cost four production price rows before it was noticed (ADR-0037).
      - name: Migrations
        run: bun run check:migrations
