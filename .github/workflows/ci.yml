name: CI

on:
  pull_request:
  push:
    branches: [main, unified/main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which typecheck, lint and build all need.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # tests/, scripts/ and migration/ run under Bun, so Nuxt's typecheck does not see them.
      - name: Typecheck (Bun projects)
        run: bun run typecheck:bun

      # Unit and integration only, in under a second. The end-to-end suites need a dev server and
      # a browser, and run in their own workflow (0029).
      - name: Tests
        run: bun run test

      # The six invariant checkers. One step rather than six, because the runner runs all of
      # them and names each failure as a GitHub annotation (`scripts/check.ts`).
      - name: Checks
        run: bun run check
