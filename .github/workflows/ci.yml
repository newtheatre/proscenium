name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which generates .nuxt/ (needed by
      # typecheck, lint and build).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      # Typecheck is a hard gate — the codebase is clean.
      - name: Typecheck
        run: bun run typecheck

      # Lint is reported but not yet blocking: there is still a backlog of
      # pre-existing style errors. Drop `continue-on-error` once it is cleared.
      - name: Lint
        run: bun run lint
        continue-on-error: true
