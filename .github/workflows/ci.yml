name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which generates .nuxt/ (needed by
      # typecheck, lint and build).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      # Typecheck and lint are hard gates — the codebase is clean.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint
