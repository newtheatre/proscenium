# Every pull request and every push to next and main: lint, types, conformance, the three test
# tiers and a production build. Linux only, the supported system for tests. No secrets are used.
name: CI

on:
  pull_request:
  push:
    branches: [next, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the migration check compares with the newest release tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:conformance

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The interface's browser tests need the gallery fixture module, which only this build includes.
      - run: bun run build
        env:
          PROSCENIUM_GALLERY: '1'
      - name: Worker size
        run: |
          du -sh .output/server
          gzip -c .output/server/chunks/nitro/nitro.mjs | wc -c | awk '{ printf "nitro.mjs gzipped: %.0f KB\n", $1 / 1024 }' >> "$GITHUB_STEP_SUMMARY"
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
