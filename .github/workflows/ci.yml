name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which generates .nuxt/ (needed by
      # typecheck, lint and build).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production build is the hard gate: a red build means a broken deploy.
      - name: Build
        run: bun run build

      # Typecheck and lint are reported but not yet blocking: the repository has
      # a backlog of pre-existing errors (tracked in the known-issues docs). Drop
      # `continue-on-error` once that backlog is cleared so they gate PRs too.
      - name: Typecheck
        run: bun run typecheck
        continue-on-error: true

      - name: Lint
        run: bun run lint
        continue-on-error: true
