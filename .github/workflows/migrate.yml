# Apply pending database migrations to production.
#
# Runs on pushes to main only — never on a pull request. A PR must not touch the
# production database, and `pull_request` events do not get repository secrets
# from forks anyway.
#
# This does NOT deploy. Cloudflare Workers Builds deploys the Worker on its own
# when main moves, and the two cannot be sequenced from here — see the note on
# ordering in docs/08-operations.md §5.
name: Migrate

on:
  push:
    branches: [main]
    # Nothing else can change what needs applying, so skip the run entirely for
    # commits that only touch app code, docs or config.
    paths:
      - 'server/db/migrations/**'
      - '.github/workflows/migrate.yml'
  # Manual runs for when a migration is committed alongside something else, or
  # when a run needs repeating after a failure.
  workflow_dispatch:

# One migration at a time. Two runs applying the same file concurrently would
# race on the `_hub_migrations` ledger; `cancel-in-progress: false` because
# cancelling a half-applied migration is worse than queueing behind it.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      # `nuxt db migrate` reads the NUXT_HUB_* triplet; wrangler (used for the
      # Time Travel bookmark) reads the CLOUDFLARE_* pair. Same credentials,
      # two naming conventions.
      NUXT_HUB_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUXT_HUB_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret: the same id is committed in nuxt.config.ts.
      NUXT_HUB_CLOUDFLARE_DATABASE_ID: 01a75263-87a9-452a-a4a0-b3b9db71dfe5
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `nuxt prepare`, which generates the drizzle config and
      # schema that `nuxt db migrate` reads. No full build is needed — this job
      # only touches the database.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fail fast if credentials are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi

      # Informational. `continue-on-error` because a hiccup reading the ledger
      # here is not a reason to skip the migration — the check that matters runs
      # after the apply and is not forgiving.
      - name: Show what is pending
        continue-on-error: true
        run: |
          pending=$(./.github/scripts/pending-migrations.sh)
          if [ -z "$pending" ]; then
            echo "Nothing pending."
          else
            echo "Pending:"; echo "$pending" | sed 's/^/  /'
          fi

      # Captured *before* anything is applied, so a bad migration always has a
      # recorded restore point in this run's output. Time Travel keeps 30 days,
      # but finding the right bookmark after the fact means guessing at
      # timestamps — this pins the exact one.
      - name: Record a Time Travel restore point
        id: bookmark
        run: |
          set -o pipefail
          out=$(bunx wrangler d1 time-travel info proscenium 2>&1 | tee /dev/stderr)
          mark=$(echo "$out" | grep -oE "[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}" | head -1)
          if [ -z "$mark" ]; then
            echo "::error::Could not read a Time Travel bookmark — refusing to migrate without a restore point."
            exit 1
          fi
          echo "bookmark=$mark" >> "$GITHUB_OUTPUT"
          {
            echo "### Database restore point"
            echo
            echo "Taken before this run applied anything."
            echo
            echo '```bash'
            echo "bunx wrangler d1 time-travel restore proscenium --bookmark=$mark"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `nuxt-db`, not `nuxt db`. The `nuxt db` proxy swallows the exit code —
      # verified on both 0.10.6 and 0.10.8, a failed migration still exits 0 —
      # which is how the first run of this workflow reported success while
      # applying nothing. The bin that @nuxthub/core installs propagates it.
      - name: Apply migrations
        run: NODE_ENV=production ./node_modules/.bin/nuxt-db migrate --verbose

      # The real gate. Whatever the CLI claimed, the ledger is the truth: if
      # anything is still pending, the migration did not land and this job must
      # be red. Belt and braces against the CLI going quiet again in a future
      # release.
      - name: Verify nothing is still pending
        run: |
          if ! pending=$(./.github/scripts/pending-migrations.sh); then
            echo "::error::Could not read the migration ledger to confirm the result. Check production by hand."
            exit 1
          fi
          if [ -n "$pending" ]; then
            echo "::error::Migrations are still pending after the apply step — it failed silently:"
            echo "$pending" | sed 's/^/  /'
            exit 1
          fi
          echo "Ledger confirms nothing is pending."

      - name: Report the restore point on failure
        if: failure() && steps.bookmark.outputs.bookmark != ''
        run: |
          echo "::error::Migration failed or did not land. Restore with: bunx wrangler d1 time-travel restore proscenium --bookmark=${{ steps.bookmark.outputs.bookmark }}"
