name: End-to-end

# Not on every pull request: these drive a real browser against a dev server, take minutes rather
# than seconds, and are the suite a person runs deliberately (0029).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: End-to-end suites
        run: bun run test:e2e
