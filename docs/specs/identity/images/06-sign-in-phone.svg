<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" role="img" aria-label="Signing in takes one screen and one email" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#111827">Signing in takes one screen and one email</text><g><rect x="96" y="56" width="240" height="400" rx="20" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="116" y="100" font-size="15" font-weight="600" fill="#111827">Sign in</text><rect x="116" y="120" width="200" height="40" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="216" y="145" text-anchor="middle" font-weight="600" fill="#111827">Use a passkey</text><line x1="116" y1="184" x2="196" y2="184" stroke="#d1d5db"></line><text x="216" y="188" text-anchor="middle" font-size="11.5" fill="#4b5563">or</text><line x1="236" y1="184" x2="316" y2="184" stroke="#d1d5db"></line><rect x="116" y="204" width="200" height="40" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="128" y="229" fill="#4b5563">Email address</text><rect x="116" y="256" width="200" height="40" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="216" y="281" text-anchor="middle" fill="#111827">Email me a link and code</text><rect x="116" y="308" width="200" height="40" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="216" y="333" text-anchor="middle" fill="#111827">Continue with Google</text><text x="116" y="384" font-size="11.5" fill="#4b5563">No password. New here? The same</text><text x="116" y="400" font-size="11.5" fill="#4b5563">form creates your account.</text></g><g><rect x="424" y="56" width="240" height="400" rx="20" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="444" y="100" font-size="15" font-weight="600" fill="#111827">Check your email</text><text x="444" y="124" font-size="11.5" fill="#4b5563">We sent a link and a code to</text><text x="444" y="140" font-size="11.5" fill="#4b5563">the address you gave.</text><rect x="444" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="478" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="512" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="546" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="580" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="614" y="164" width="28" height="40" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="444" y="226" font-size="11.5" fill="#4b5563">Enter the six-digit code</text><rect x="444" y="244" width="200" height="40" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="544" y="269" text-anchor="middle" font-weight="600" fill="#111827">Continue</text><text x="444" y="316" font-size="11.5" fill="#4b5563">Both last 15 minutes. The code</text><text x="444" y="332" font-size="11.5" fill="#4b5563">works only in this browser.</text><text x="444" y="384" fill="#111827">Use a different address</text></g><text x="216" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">1. Sign in</text><text x="544" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">2. After asking for an email</text></svg>