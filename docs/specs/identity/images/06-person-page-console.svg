<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-label="The account page shows identity facts, and each module adds its own section" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#111827">The account page shows identity facts; each module adds its own section</text><text x="24" y="62" font-size="11.5" fill="#4b5563">Console / People / Person name</text><g><rect x="24" y="76" width="240" height="316" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="106" font-size="15" font-weight="600" fill="#111827">Person name</text><text x="40" y="126" font-size="11.5" fill="#4b5563">Known as, pronouns</text><rect x="40" y="140" width="72" height="24" rx="12" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.25"></rect><text x="76" y="156" text-anchor="middle" font-size="11.5" fill="#111827">Claimed</text><rect x="120" y="140" width="72" height="24" rx="12" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.25"></rect><text x="156" y="156" text-anchor="middle" font-size="11.5" fill="#111827">Member</text><line x1="40" y1="180" x2="248" y2="180" stroke="#d1d5db"></line><text x="40" y="204" font-weight="600" fill="#111827">Email addresses</text><text x="40" y="226" font-size="11.5" fill="#4b5563">Primary address, verified</text><text x="40" y="244" font-size="11.5" fill="#4b5563">Second address, not yet verified</text><line x1="40" y1="262" x2="248" y2="262" stroke="#d1d5db"></line><rect x="40" y="278" width="208" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="144" y="298" text-anchor="middle" fill="#111827">Issue enrolment link</text><rect x="40" y="318" width="100" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="90" y="338" text-anchor="middle" fill="#111827">Merge</text><rect x="148" y="318" width="100" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="198" y="338" text-anchor="middle" fill="#111827">Disable</text><text x="40" y="374" font-size="11.5" fill="#4b5563">Each asks for a fresh passkey check</text></g><g><rect x="280" y="76" width="456" height="68" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="296" y="102" font-weight="600" fill="#111827">How they sign in</text><text x="296" y="124" font-size="11.5" fill="#4b5563">Passkeys by name and last use, provider links, whether recovery codes are set</text></g><g><rect x="280" y="158" width="456" height="68" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="296" y="184" font-weight="600" fill="#111827">Roles and standings</text><text x="296" y="206" font-size="11.5" fill="#4b5563">Role, scope, granted by, ends on. Standings with their source. Grant a role.</text></g><g><rect x="280" y="240" width="456" height="68" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="296" y="266" font-weight="600" fill="#111827">Sessions</text><text x="296" y="288" font-size="11.5" fill="#4b5563">Device, started, last used, assurance. End one or end all.</text></g><g><rect x="280" y="322" width="456" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text x="296" y="348" font-weight="600" fill="#111827">From other modules</text><text x="296" y="368" font-size="11.5" fill="#4b5563">Orders, membership, shifts, training: one section each, drawn by its module</text><text x="296" y="384" font-size="11.5" fill="#4b5563">and shown only to somebody holding that module ability</text></g><text x="24" y="422" font-size="11.5" fill="#4b5563">Opening this page is audited. On a phone the person card comes first and the sections stack beneath it.</text></svg>