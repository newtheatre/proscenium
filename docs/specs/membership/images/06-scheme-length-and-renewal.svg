<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-label="Wireframe of a scheme in the console, on its Length and renewal tab, with two lengths offered" font-size="12.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">A scheme: one end date each year, offered for one year or three</text><g><rect x="24" y="44" width="712" height="348" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="68" font-size="11.5" fill="#4b5563">Membership / Schemes</text><text x="40" y="92" font-size="15" font-weight="600" fill="#111827">Student member</text><text x="720" y="92" text-anchor="end" font-size="11.5" fill="#4b5563">Open, members&#x27; side</text></g><g><text x="40" y="120" fill="#4b5563">Details</text><text x="104" y="120" font-weight="600" fill="#111827">Length and renewal</text><line x1="104" y1="128" x2="226" y2="128" stroke="#2563eb" stroke-width="2"></line><text x="250" y="120" fill="#4b5563">Joining</text><text x="314" y="120" fill="#4b5563">Application form</text><text x="436" y="120" fill="#4b5563">Fee</text><text x="480" y="120" fill="#4b5563">Members</text><line x1="40" y1="129" x2="720" y2="129" stroke="#d1d5db"></line></g><g><text x="40" y="154" font-size="11.5" fill="#4b5563">How a membership&#x27;s end is set</text><rect x="40" y="160" width="300" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="52" y="180" fill="#111827">On the same date every year</text><text x="364" y="154" font-size="11.5" fill="#4b5563">Ends on</text><rect x="364" y="160" width="120" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="376" y="180" fill="#111827">31 July</text><text x="508" y="154" font-size="11.5" fill="#4b5563">Counts for next year within</text><rect x="508" y="160" width="120" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="520" y="180" fill="#111827">60 days</text></g><g><text x="40" y="222" font-size="13" font-weight="600" fill="#111827">Lengths offered</text><text x="40" y="246" font-size="11.5" fill="#4b5563">Name</text><text x="240" y="246" font-size="11.5" fill="#4b5563">Length</text><text x="440" y="246" font-size="11.5" fill="#4b5563">State</text><line x1="40" y1="254" x2="720" y2="254" stroke="#d1d5db"></line><text x="40" y="274" fill="#111827">1 year</text><text x="240" y="274" fill="#111827">1 scheme year</text><text x="440" y="274" fill="#111827">Offered</text><line x1="40" y1="284" x2="720" y2="284" stroke="#d1d5db"></line><text x="40" y="304" fill="#111827">3 years</text><text x="240" y="304" fill="#111827">3 scheme years</text><text x="440" y="304" fill="#111827">Offered</text><rect x="608" y="208" width="112" height="28" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="664" y="226" text-anchor="middle" fill="#111827">Add a length</text></g><g><rect x="40" y="322" width="680" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text x="56" y="344" fill="#111827">Somebody joining today, 16 November 2026, would be a member until</text><text x="56" y="362" fill="#111827">31 July 2027 with 1 year, or 31 July 2029 with 3 years.</text></g></svg>