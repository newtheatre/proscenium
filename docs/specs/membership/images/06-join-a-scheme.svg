<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Wireframe of joining a scheme: choosing a length, then the details the committee will check" font-size="12.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">Joining: choose a length, then give what the committee will check</text><g><rect x="24" y="44" width="712" height="336" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="72" font-size="15" font-weight="600" fill="#111827">Join: Student member</text></g><g><text x="40" y="102" font-weight="600" fill="#111827">1 About</text><line x1="40" y1="110" x2="92" y2="110" stroke="#2563eb" stroke-width="2"></line><text x="120" y="102" fill="#4b5563">2 Your details</text><text x="236" y="102" fill="#4b5563">3 Check</text><text x="312" y="102" fill="#4b5563">Done</text><line x1="40" y1="111" x2="720" y2="111" stroke="#d1d5db"></line></g><g><text x="40" y="140" font-size="13" font-weight="600" fill="#111827">How long is your membership?</text><circle cx="48" cy="164" r="7" fill="none" stroke="#6b7280" stroke-width="1.25"></circle><text x="66" y="168" fill="#111827">1 year</text><text x="150" y="168" fill="#4b5563">until 31 July 2027</text><circle cx="48" cy="190" r="7" fill="none" stroke="#2563eb" stroke-width="2"></circle><circle cx="48" cy="190" r="3.5" fill="#2563eb"></circle><text x="66" y="194" fill="#111827">3 years</text><text x="150" y="194" fill="#4b5563">until 31 July 2029</text><text x="40" y="218" font-size="11.5" fill="#4b5563">Choose what you bought from the students&#x27; union. Shown only when a scheme offers more than one length.</text></g><g><text x="40" y="252" font-size="13" font-weight="600" fill="#111827">Your details</text><text x="40" y="274" font-size="11.5" fill="#4b5563">Name the union has for you</text><rect x="40" y="280" width="320" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="52" y="300" fill="#111827">Alexandra Example</text><text x="384" y="274" font-size="11.5" fill="#4b5563">Student ID</text><rect x="384" y="280" width="200" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="396" y="300" fill="#111827">20417788</text><text x="40" y="328" font-size="11.5" fill="#4b5563">The theatre&#x27;s own form fields. On the union&#x27;s list you are a member at once; otherwise the committee checks.</text></g><g><rect x="40" y="340" width="80" height="28" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="80" y="358" text-anchor="middle" fill="#111827">Back</text><rect x="132" y="340" width="110" height="28" rx="6" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"></rect><text x="187" y="358" text-anchor="middle" font-weight="600" fill="#111827">Continue</text></g></svg>