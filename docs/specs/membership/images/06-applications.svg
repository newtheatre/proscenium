<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Wireframe of the Applications list in the console with the check panel open" font-size="12.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">Applications: the committee sees the answers, sets the length, and passes</text><g><rect x="24" y="44" width="712" height="336" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="68" font-size="11.5" fill="#4b5563">Membership / Applications</text></g><g><rect x="40" y="82" width="244" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text x="52" y="104" font-weight="600" fill="#111827">Casey Person</text><text x="52" y="122" font-size="11.5" fill="#4b5563">Student member, waiting 2 days</text><line x1="40" y1="188" x2="284" y2="188" stroke="#d1d5db"></line><text x="52" y="158" fill="#111827">Devon Example</text><text x="52" y="176" font-size="11.5" fill="#4b5563">Student member, waiting 1 day</text><text x="52" y="212" fill="#111827">Eli Sample</text><text x="52" y="230" font-size="11.5" fill="#4b5563">Friend, unpaid for 8 days</text><text x="52" y="362" font-size="11.5" fill="#4b5563">Your own application is never here.</text></g><g><rect x="300" y="82" width="420" height="282" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="316" y="108" font-size="13" font-weight="600" fill="#111827">Check Casey Person</text><text x="704" y="108" text-anchor="end" font-size="11.5" fill="#4b5563">Student member</text><line x1="316" y1="118" x2="704" y2="118" stroke="#d1d5db"></line><text x="316" y="142" font-size="11.5" fill="#4b5563">Name the union has</text><text x="480" y="142" fill="#111827">Casey J Person</text><text x="316" y="164" font-size="11.5" fill="#4b5563">Student ID</text><text x="480" y="164" fill="#111827">20417788</text><text x="316" y="186" font-size="11.5" fill="#4b5563">On the union&#x27;s list</text><text x="480" y="186" fill="#111827">Not found, so it came to you</text><line x1="316" y1="200" x2="704" y2="200" stroke="#d1d5db"></line><text x="316" y="226" font-size="11.5" fill="#4b5563">Length (they chose 3 years)</text><rect x="316" y="236" width="84" height="28" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="358" y="254" text-anchor="middle" fill="#111827">1 year</text><rect x="408" y="236" width="84" height="28" rx="6" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"></rect><text x="450" y="254" text-anchor="middle" font-weight="600" fill="#111827">3 years</text><text x="508" y="254" fill="#111827">Ends 31 July 2029</text><text x="316" y="286" font-size="11.5" fill="#4b5563">Note</text><rect x="316" y="292" width="388" height="28" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="328" y="311" fill="#111827">Seen on the union&#x27;s site, 16 November</text><rect x="524" y="328" width="84" height="28" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="566" y="346" text-anchor="middle" fill="#111827">Decline</text><rect x="620" y="328" width="84" height="28" rx="6" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"></rect><text x="662" y="346" text-anchor="middle" font-weight="600" fill="#111827">Pass</text></g></svg>