<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-label="Wireframe of choosing tickets, where a student ID gives the member price without an account" font-size="12.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">At the checkout: a student ID gives the member price, with no account</text><text x="24" y="48" font-size="11.5" fill="#4b5563">Box office&#x27;s screen, drawn here only to show the field Membership asks it for</text><g><rect x="24" y="60" width="712" height="308" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="88" font-size="15" font-weight="600" fill="#111827">Choose tickets</text><text x="720" y="88" text-anchor="end" font-size="11.5" fill="#4b5563">Spring show, Friday 12 March 2027, 7.30 pm</text><line x1="40" y1="100" x2="720" y2="100" stroke="#d1d5db"></line></g><g><text x="40" y="126" fill="#111827">Standard</text><text x="560" y="126" text-anchor="end" fill="#111827">£8.00</text><rect x="620" y="106" width="100" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="670" y="126" text-anchor="middle" fill="#111827">-   0   +</text><line x1="40" y1="146" x2="720" y2="146" stroke="#d1d5db"></line></g><g><text x="40" y="172" font-weight="600" fill="#111827">NNT member</text><text x="560" y="172" text-anchor="end" fill="#111827">£5.00</text><rect x="620" y="152" width="100" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="670" y="172" text-anchor="middle" fill="#111827">-   1   +</text><text x="40" y="200" font-size="11.5" fill="#4b5563">NNT member? Enter your University of Nottingham student ID</text><rect x="40" y="206" width="200" height="30" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="52" y="226" fill="#111827">20417788</text><rect x="252" y="207" width="84" height="28" rx="6" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"></rect><text x="294" y="225" text-anchor="middle" font-weight="600" fill="#111827">Check</text><circle cx="360" cy="221" r="6" fill="#059669"></circle><text x="374" y="225" fill="#111827">Member price applied. Valid until 31 July 2027.</text><text x="40" y="258" font-size="11.5" fill="#4b5563">Already joined? Sign in and you will not be asked. One member ticket for each student ID.</text></g><g><rect x="40" y="276" width="680" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text x="56" y="298" font-size="11.5" fill="#4b5563">When the ID is well formed but not on the list, the same place reads:</text><text x="56" y="318" fill="#111827">We could not find an NNT membership for that ID. Have a membership? Contact us</text><text x="56" y="338" font-size="11.5" fill="#4b5563">When it is mistyped: A University of Nottingham student ID is 8 digits. A standard or concession ticket never shows this field.</text></g></svg>