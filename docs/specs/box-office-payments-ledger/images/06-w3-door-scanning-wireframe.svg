<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="The door answers every scan with one word and one colour" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#111827">The door answers every scan with one word and one colour</text><g><rect x="24" y="56" width="224" height="390" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="84" font-size="11.5" fill="#4b5563">Ready</text><text x="232" y="84" text-anchor="end" font-size="11.5" fill="#4b5563">Hamlet, 7:30 pm</text><rect x="56" y="110" width="160" height="160" rx="8" fill="none" stroke="#6b7280" stroke-dasharray="6 6"></rect><text x="136" y="194" text-anchor="middle" fill="#4b5563">Point at a ticket</text><text x="136" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">112 of 148 in</text><text x="136" y="336" text-anchor="middle" font-size="11.5" fill="#4b5563">36 to come, 2 wheelchair users</text><rect x="40" y="392" width="192" height="36" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="136" y="415" text-anchor="middle" fill="#111827">Find by name</text></g><g><rect x="268" y="56" width="224" height="390" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="284" y="84" font-size="11.5" fill="#4b5563">A good ticket</text><rect x="284" y="96" width="192" height="150" rx="8" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"></rect><text x="380" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Admitted</text><text x="380" y="190" text-anchor="middle" fill="#111827">Full price, Stalls</text><text x="284" y="280" font-size="11.5" fill="#111827">Order K7M-2QF, ticket 1 of 2</text><text x="284" y="302" font-size="11.5" fill="#111827">Access note on this order</text><text x="284" y="346" font-size="11.5" fill="#4b5563">Ready again in 2 seconds</text><rect x="284" y="392" width="192" height="36" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="380" y="415" text-anchor="middle" fill="#111827">Undo</text></g><g><rect x="512" y="56" width="224" height="390" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="528" y="84" font-size="11.5" fill="#4b5563">A refusal, and offline</text><rect x="528" y="96" width="192" height="150" rx="8" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"></rect><text x="624" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Already in</text><text x="624" y="190" text-anchor="middle" fill="#111827">7:12 pm at Door 2</text><rect x="528" y="262" width="192" height="28" rx="6" fill="#d97706" fill-opacity="0.12" stroke="#d97706"></rect><text x="624" y="281" text-anchor="middle" font-size="11.5" fill="#111827">Offline: 3 scans queued</text><text x="528" y="322" font-size="11.5" fill="#4b5563">Other refusals: wrong night,</text><text x="528" y="338" font-size="11.5" fill="#4b5563">cancelled, not a ticket</text><rect x="528" y="392" width="192" height="36" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="624" y="415" text-anchor="middle" fill="#111827">Call the duty manager</text></g></svg>