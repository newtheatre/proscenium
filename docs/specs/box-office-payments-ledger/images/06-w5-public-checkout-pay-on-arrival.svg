<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-label="Reserving online takes three screens and no payment" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111827">Reserving online takes three screens and no payment</text><g fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M240 226H272" marker-end="url(#reserve-arrow)"></path><path d="M488 226H520" marker-end="url(#reserve-arrow)"></path></g><g><rect x="24" y="56" width="216" height="340" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="82" font-size="11.5" fill="#4b5563">Your details · held for 9 minutes</text><text x="40" y="108" font-weight="600" fill="#111827">Who is the booking for?</text><text x="40" y="134" font-size="11.5" fill="#4b5563">Name</text><rect x="40" y="140" width="184" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280"></rect><text x="40" y="192" font-size="11.5" fill="#4b5563">Email</text><rect x="40" y="198" width="184" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280"></rect><line x1="40" y1="248" x2="224" y2="248" stroke="#d1d5db"></line><text x="40" y="270" fill="#111827">2 full price, 1 student</text><text x="40" y="290" fill="#111827">£22.00 to pay on arrival</text><text x="40" y="310" font-size="11.5" fill="#4b5563">No payment is taken today</text><rect x="40" y="338" width="184" height="38" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="132" y="362" text-anchor="middle" font-weight="600" fill="#111827">Reserve 3 tickets</text></g><g><rect x="272" y="56" width="216" height="340" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="288" y="82" font-size="11.5" fill="#4b5563">One more step · held for 8 minutes</text><text x="288" y="108" font-weight="600" fill="#111827">Check your email</text><text x="288" y="134" fill="#111827">We have sent a link to the</text><text x="288" y="152" fill="#111827">address you gave. Open it to</text><text x="288" y="170" fill="#111827">confirm your reservation.</text><text x="288" y="204" font-size="11.5" fill="#4b5563">Your seats are held while you do.</text><text x="288" y="222" font-size="11.5" fill="#4b5563">Signed-in buyers skip this screen.</text><rect x="288" y="294" width="184" height="38" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="380" y="318" text-anchor="middle" fill="#111827">Send the link again</text><rect x="288" y="338" width="184" height="38" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="380" y="362" text-anchor="middle" fill="#111827">Change the address</text></g><g><rect x="520" y="56" width="216" height="340" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="536" y="82" font-size="11.5" fill="#4b5563">Reserved</text><text x="536" y="108" font-weight="600" fill="#111827">Your seats are reserved</text><rect x="536" y="122" width="184" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280"></rect><text x="628" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">K7QF</text><text x="628" y="172" text-anchor="middle" font-size="11.5" fill="#4b5563">Show this code at the desk</text><text x="536" y="212" fill="#111827">£22.00 to pay at the desk</text><text x="536" y="232" font-size="11.5" fill="#4b5563">Card or cash, on the night</text><text x="536" y="256" font-size="11.5" fill="#4b5563">Collect by 19:15 or the seats</text><text x="536" y="272" font-size="11.5" fill="#4b5563">may be released</text><rect x="536" y="294" width="184" height="38" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="628" y="318" text-anchor="middle" fill="#111827">Add to calendar</text><rect x="536" y="338" width="184" height="38" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="628" y="362" text-anchor="middle" fill="#111827">Cancel or change</text></g><text x="24" y="424" font-size="11.5" fill="#4b5563">The steps before these (performance, tickets, basket) are the same as for a paid booking. Figures are examples.</text></svg>