<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-label="At the desk a reservation is adjusted, then paid and admitted in one press" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#111827">At the desk a reservation is adjusted, then paid and admitted in one press</text><g><rect x="24" y="48" width="430" height="36" rx="8" fill="#f3f4f6" stroke="#6b7280"></rect><text x="40" y="71" fill="#4b5563">Scan the desk code, or type a name or reference</text><text x="736" y="71" text-anchor="end" font-size="11.5" fill="#4b5563">Tonight 19:30 · 14 reservations to collect</text></g><g><rect x="24" y="100" width="430" height="328" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="128" font-weight="600" fill="#111827">Reservation K7QF · Jordan Lee</text><text x="40" y="146" font-size="11.5" fill="#4b5563">Reserved 2 November · email confirmed · nothing paid</text><line x1="40" y1="160" x2="438" y2="160" stroke="#d1d5db"></line><text x="40" y="190" fill="#111827">Full price</text><g><rect x="250" y="175" width="22" height="22" rx="6" fill="none" stroke="#6b7280"></rect><rect x="300" y="175" width="22" height="22" rx="6" fill="none" stroke="#6b7280"></rect><line x1="256" y1="186" x2="266" y2="186" stroke="#6b7280" stroke-width="1.5"></line><line x1="306" y1="186" x2="316" y2="186" stroke="#6b7280" stroke-width="1.5"></line><line x1="311" y1="181" x2="311" y2="191" stroke="#6b7280" stroke-width="1.5"></line></g><text x="286" y="190" text-anchor="middle" fill="#111827">2</text><text x="438" y="190" text-anchor="end" fill="#111827">£16.00</text><text x="40" y="226" fill="#111827">Student</text><g><rect x="250" y="211" width="22" height="22" rx="6" fill="none" stroke="#6b7280"></rect><rect x="300" y="211" width="22" height="22" rx="6" fill="none" stroke="#6b7280"></rect><line x1="256" y1="222" x2="266" y2="222" stroke="#6b7280" stroke-width="1.5"></line><line x1="306" y1="222" x2="316" y2="222" stroke="#6b7280" stroke-width="1.5"></line><line x1="311" y1="217" x2="311" y2="227" stroke="#6b7280" stroke-width="1.5"></line></g><text x="286" y="226" text-anchor="middle" fill="#111827">1</text><text x="438" y="226" text-anchor="end" fill="#111827">£6.00</text><line x1="40" y1="248" x2="438" y2="248" stroke="#d1d5db"></line><text x="40" y="272" font-size="11.5" fill="#4b5563">Changed tonight: one ticket removed, so one seat went back on sale</text><text x="40" y="290" font-size="11.5" fill="#4b5563">Prices are those fixed when the reservation was made</text><rect x="40" y="376" width="150" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="115" y="399" text-anchor="middle" fill="#111827">Release reservation</text><rect x="202" y="376" width="150" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="277" y="399" text-anchor="middle" fill="#111827">Keep for latecomer</text></g><g><rect x="470" y="100" width="266" height="328" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="486" y="128" font-weight="600" fill="#111827">Also in this payment</text><text x="486" y="152" fill="#111827">2 soft drinks</text><text x="720" y="152" text-anchor="end" fill="#111827">£3.00</text><text x="486" y="174" font-size="11.5" fill="#4b5563">+ Add items (lines from another module)</text><line x1="486" y1="188" x2="720" y2="188" stroke="#d1d5db"></line><text x="486" y="214" font-size="11.5" fill="#4b5563">To pay</text><text x="720" y="226" text-anchor="end" font-size="28" font-weight="600" fill="#111827">£25.00</text><text x="486" y="248" font-size="11.5" fill="#4b5563">Tickets £22.00 · bar £3.00</text><rect x="486" y="264" width="234" height="36" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="603" y="287" text-anchor="middle" font-weight="600" fill="#111827">Card on the reader</text><rect x="486" y="308" width="111" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="541" y="331" text-anchor="middle" fill="#111827">Cash</text><rect x="609" y="308" width="111" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="664" y="331" text-anchor="middle" fill="#111827">Card, by hand</text><rect x="486" y="366" width="16" height="16" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"></rect><text x="510" y="379" fill="#111827">Admit 3 when paid</text><text x="486" y="404" font-size="11.5" fill="#4b5563">One payment, nobody queues twice</text></g></svg>