<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Wireframe of the public production page: a header with the theatre logo and menu, a poster on the left, and on the right the title, summary, advisories control, a list of dates each with a booking action, and credits."><rect width="100%" height="100%" fill="#ffffff"/><g><rect x="10" y="10" width="740" height="380" rx="8" fill="none" stroke="#6b7280"></rect><line x1="10" y1="52" x2="750" y2="52" stroke="#d1d5db"></line></g><g><text x="28" y="37" font-size="13" font-weight="600" fill="#111827">Theatre logo</text><text x="380" y="37" text-anchor="middle" font-size="12" fill="#4b5563">What is on   Visit   Get involved   About</text><text x="732" y="37" text-anchor="end" font-size="12" fill="#4b5563">My account</text></g><g><rect x="28" y="70" width="200" height="290" rx="6" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="128" y="212" text-anchor="middle" font-size="12" fill="#4b5563">Poster</text><text x="128" y="230" text-anchor="middle" font-size="10.5" fill="#4b5563">alt text required</text></g><g><text x="252" y="84" font-size="11" fill="#4b5563">Spring season · Play</text><text x="252" y="110" font-size="20" font-weight="600" fill="#111827">Production title</text><text x="252" y="134" font-size="12" fill="#111827">Summary, two or three lines written by the theatre.</text><text x="252" y="156" font-size="11" fill="#4b5563">Studio Theatre · 2 hours with an interval</text><rect x="252" y="170" width="480" height="28" rx="4" fill="none" stroke="#d1d5db"></rect><text x="264" y="189" font-size="12" fill="#111827">Content advisories</text><text x="720" y="189" text-anchor="end" font-size="11" fill="#4b5563">Show</text></g><g><text x="252" y="222" font-size="12" font-weight="600" fill="#111827">Dates</text><line x1="252" y1="230" x2="732" y2="230" stroke="#d1d5db"></line><text x="252" y="250" font-size="12" fill="#111827">Thu 12 March, 7.30 pm</text><text x="430" y="250" font-size="11" fill="#4b5563">Captioned</text><rect x="652" y="236" width="80" height="22" rx="4" fill="#2563eb"></rect><text x="692" y="251" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-surface-primary, white)">Book</text><line x1="252" y1="264" x2="732" y2="264" stroke="#d1d5db"></line><text x="252" y="284" font-size="12" fill="#111827">Fri 13 March, 7.30 pm</text><text x="732" y="284" text-anchor="end" font-size="11" fill="#4b5563">Last few seats · Book</text><line x1="252" y1="298" x2="732" y2="298" stroke="#d1d5db"></line><text x="252" y="318" font-size="12" text-decoration="line-through" fill="#4b5563">Sat 14 March, 2.30 pm</text><text x="732" y="318" text-anchor="end" font-size="11" fill="#4b5563">Cancelled</text><line x1="252" y1="332" x2="732" y2="332" stroke="#d1d5db"></line></g><g><text x="252" y="356" font-size="12" font-weight="600" fill="#111827">Cast and creative team</text><text x="252" y="374" font-size="11" fill="#4b5563">Credits by section, then gallery and venue details below</text></g></svg>