<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-label="Tonight for someone leading a shift: one section, six things to tap" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">Tonight for someone leading a shift: one section, six things to tap</text><g><rect x="24" y="48" width="300" height="500" rx="20" fill="none" stroke="#6b7280" stroke-width="1.25"></rect></g><g><rect x="36" y="60" width="276" height="24" rx="6" fill="#f3f4f6" stroke="#6b7280"></rect><text x="48" y="76" fill="#111827">On shift until 23:30</text><text x="300" y="76" text-anchor="end" fill="#4b5563">Online</text></g><g><text x="48" y="112" font-size="15" font-weight="600" fill="#111827">Tonight</text><text x="48" y="130" fill="#4b5563">Performance title, 19:30, Studio</text><text x="48" y="146" fill="#4b5563">Curtain up in 42 minutes</text></g><g><rect x="36" y="160" width="276" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="174" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Open the house</text></g><text x="48" y="232" font-size="13" font-weight="600" fill="#111827">Front of house</text><g><rect x="36" y="244" width="132" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="48" y="268" font-size="13" font-weight="600" fill="#111827">People</text><text x="48" y="286" fill="#111827">5 of 6 arrived</text><text x="48" y="302" fill="#4b5563">1 not arrived</text></g><g><rect x="180" y="244" width="132" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="192" y="268" font-size="13" font-weight="600" fill="#111827">Checklists</text><text x="192" y="286" fill="#111827">1 of 2 complete</text><text x="192" y="302" fill="#4b5563">1 problem noted</text></g><g><rect x="36" y="324" width="132" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="48" y="348" font-size="13" font-weight="600" fill="#111827">Figures</text><text x="48" y="366" fill="#111827">Sold 84</text><text x="48" y="382" fill="#111827">Reserved 12</text></g><g><rect x="180" y="324" width="132" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="192" y="348" font-size="13" font-weight="600" fill="#111827">Incidents</text><text x="192" y="366" fill="#111827">None open</text></g><g><rect x="36" y="408" width="132" height="40" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="none"></rect><text x="102" y="432" text-anchor="middle" fill="#111827">Report an incident</text><rect x="180" y="408" width="132" height="40" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="none"></rect><text x="246" y="432" text-anchor="middle" fill="#111827">Emergency card</text></g><g><rect x="36" y="460" width="132" height="40" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="102" y="484" text-anchor="middle" fill="#111827">Extend tonight</text><rect x="180" y="460" width="132" height="40" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="246" y="484" text-anchor="middle" fill="#111827">Night report</text><text x="48" y="524" fill="#4b5563">Dashed: leading the shift only</text></g><g><line x1="324" x2="348" y1="72" y2="72" stroke="#d1d5db"></line><line x1="324" x2="348" y1="184" y2="184" stroke="#d1d5db"></line><line x1="324" x2="348" y1="228" y2="228" stroke="#d1d5db"></line><line x1="324" x2="348" y1="280" y2="280" stroke="#d1d5db"></line><line x1="324" x2="348" y1="360" y2="360" stroke="#d1d5db"></line><line x1="324" x2="348" y1="428" y2="428" stroke="#d1d5db"></line><line x1="324" x2="348" y1="480" y2="480" stroke="#d1d5db"></line></g><g><text x="356" y="68" fill="#111827">The on-shift bar and the connection state. When the window</text><text x="356" y="84" fill="#111827">closes the bar goes; later writes are refused, never retried.</text><text x="356" y="180" fill="#111827">One large button for the next timing: house open, curtain up,</text><text x="356" y="196" fill="#111827">interval, curtain down, house clear.</text><text x="356" y="232" fill="#111827">A section of Tonight. The words Tonight board never appear.</text><text x="356" y="276" fill="#111827">Tap People for the list; a lead marks others arrived.</text><text x="356" y="292" fill="#111827">A problem on a checklist shows a word, never colour alone.</text><text x="356" y="348" fill="#111827">Figures come from Box office and Payments. A figure is hidden</text><text x="356" y="364" fill="#111827">without its ability and reads unavailable if its source fails.</text><text x="356" y="380" fill="#111827">Incidents show a count and numbers only.</text><text x="356" y="432" fill="#111827">Both work with no signal; a report queues on the device.</text><text x="356" y="476" fill="#111827">Extend tonight moves every window 30 minutes later.</text><text x="356" y="492" fill="#111827">Night report: resolve people, review warnings, sign off.</text></g></svg>