<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img" aria-label="Reporting an incident takes three short steps and works offline" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">Reporting an incident takes three short steps and works offline</text><g><rect x="24" y="48" width="220" height="380" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="36" y="76" fill="#4b5563">Step 1 of 3</text><text x="36" y="98" font-size="13" font-weight="600" fill="#111827">What happened?</text><rect x="36" y="110" width="196" height="80" rx="6" fill="none" stroke="#6b7280"></rect><text x="46" y="130" fill="#4b5563">Describe what you saw</text><text x="36" y="216" font-size="13" font-weight="600" fill="#111827">Where?</text><rect x="36" y="226" width="196" height="32" rx="6" fill="none" stroke="#6b7280"></rect><text x="46" y="246" fill="#4b5563">Foyer stairs</text><rect x="36" y="372" width="196" height="40" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="134" y="396" text-anchor="middle" fill="#111827">Next</text></g><g><rect x="268" y="48" width="220" height="380" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="280" y="76" fill="#4b5563">Step 2 of 3</text><text x="280" y="98" font-size="13" font-weight="600" fill="#111827">When?</text><rect x="280" y="110" width="196" height="32" rx="6" fill="none" stroke="#6b7280"></rect><text x="290" y="130" fill="#111827">Today, 20:14</text><text x="280" y="176" font-size="13" font-weight="600" fill="#111827">What kind?</text><rect x="280" y="188" width="92" height="36" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="326" y="210" text-anchor="middle" fill="#111827">Incident</text><rect x="384" y="188" width="92" height="36" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="430" y="210" text-anchor="middle" fill="#111827">Near miss</text><rect x="280" y="372" width="196" height="40" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text x="378" y="396" text-anchor="middle" fill="#111827">Next</text></g><g><rect x="512" y="48" width="220" height="380" rx="16" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="524" y="76" fill="#4b5563">Step 3 of 3</text><text x="524" y="98" font-size="13" font-weight="600" fill="#111827">Was anyone hurt?</text><rect x="524" y="110" width="196" height="32" rx="6" fill="none" stroke="#6b7280"></rect><text x="534" y="130" fill="#111827">Someone was hurt</text><rect x="524" y="150" width="196" height="32" rx="6" fill="none" stroke="#6b7280"></rect><text x="534" y="170" fill="#111827">First aid was given</text><rect x="524" y="190" width="196" height="32" rx="6" fill="none" stroke="#6b7280"></rect><text x="534" y="210" fill="#111827">Emergency services called</text><text x="524" y="246" fill="#4b5563">First aid or emergency services</text><text x="524" y="262" fill="#4b5563">raise the severity.</text><rect x="524" y="372" width="196" height="40" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="622" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Send report</text></g><g><text x="24" y="456" fill="#111827">With no signal the report is saved on the device and sent when the connection returns; the number appears then.</text><text x="24" y="474" fill="#111827">No names are asked for here. People and welfare details are added at review by a welfare lead.</text></g></svg>