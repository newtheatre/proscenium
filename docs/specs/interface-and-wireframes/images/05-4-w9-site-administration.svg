<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" role="img" aria-label="Site administration: its own sidebar, a labelled header and an overview of what needs attention" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">Site administration: the console&#x27;s frame, plainly labelled, with its own sidebar</text><g><rect x="24" y="44" width="176" height="500" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="36" y="66" font-weight="600" fill="#111827">‹ Back to console</text><line x1="24" x2="200" y1="78" y2="78" stroke="#d1d5db"></line><rect x="36" y="86" width="152" height="20" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="44" y="100" font-weight="600" fill="#111827">Overview</text><text x="36" y="124" font-size="10.5" fill="#4b5563">Theatre</text><text x="44" y="140" fill="#111827">Organisation</text><text x="44" y="156" fill="#111827">Branding</text><text x="44" y="172" fill="#111827">Vocabularies</text><text x="44" y="188" fill="#111827">Navigation</text><text x="44" y="204" fill="#111827">Site readiness</text><text x="36" y="226" font-size="10.5" fill="#4b5563">Modules and settings</text><text x="44" y="242" fill="#111827">Modules</text><text x="44" y="258" fill="#111827">Settings</text><text x="36" y="280" font-size="10.5" fill="#4b5563">Access</text><text x="44" y="296" fill="#111827">Roles</text><text x="44" y="312" fill="#111827">Facts</text><text x="44" y="328" fill="#111827">Sign-in</text><text x="36" y="350" font-size="10.5" fill="#4b5563">Email</text><text x="44" y="366" fill="#111827">Senders</text><text x="44" y="382" fill="#111827">Delivery health</text><text x="36" y="404" font-size="10.5" fill="#4b5563">Connections</text><text x="44" y="420" fill="#111827">Credentials</text><text x="44" y="436" fill="#111827">Webhooks</text><text x="36" y="458" font-size="10.5" fill="#4b5563">Upkeep</text><text x="44" y="474" fill="#111827">Updates</text><text x="44" y="490" fill="#111827">Jobs</text><text x="44" y="506" fill="#111827">Health</text><text x="44" y="522" fill="#111827">Audit log</text></g><g><rect x="24" y="44" width="712" height="500" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="200" y="44" width="536" height="26" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="216" y="61" font-weight="600" fill="#111827">Site administration</text><text x="724" y="61" text-anchor="end" font-size="10.5" fill="#4b5563">Lantern Theatre</text><line x1="200" x2="736" y1="112" y2="112" stroke="#d1d5db"></line><text x="216" y="96" font-size="15" font-weight="600" fill="#111827">Overview</text><rect x="476" y="79" width="150" height="24" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="486" y="95" fill="#4b5563">Search or go to   Ctrl K</text><circle cx="648" cy="91" r="10" fill="none" stroke="#6b7280"></circle><text x="648" y="95" text-anchor="middle" fill="#111827">?</text><circle cx="704" cy="91" r="10" fill="none" stroke="#6b7280"></circle><text x="704" y="95" text-anchor="middle" font-size="10.5" fill="#111827">SP</text></g><g><text x="216" y="140" font-weight="600" fill="#111827">Needs attention</text><rect x="216" y="152" width="504" height="44" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="228" y="170" font-weight="600" fill="#111827">A newer release is available</text><text x="228" y="186" font-size="10.5" fill="#4b5563">Read what changed before you deploy it.</text><text x="708" y="178" text-anchor="end" fill="#111827">Open Updates</text><rect x="216" y="204" width="504" height="44" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="228" y="222" font-weight="600" fill="#111827">The sending domain is not verified</text><text x="228" y="238" font-size="10.5" fill="#4b5563">Emails cannot be sent until it is.</text><text x="708" y="230" text-anchor="end" fill="#111827">Open Senders</text><rect x="216" y="256" width="504" height="44" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="228" y="274" font-weight="600" fill="#111827">2 jobs failed in the last day</text><text x="228" y="290" font-size="10.5" fill="#4b5563">Both can be run again.</text><text x="708" y="282" text-anchor="end" fill="#111827">Open Jobs</text></g><g><text x="216" y="332" font-weight="600" fill="#111827">This installation</text><rect x="216" y="344" width="160" height="64" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="228" y="364" font-size="10.5" fill="#4b5563">Modules</text><text x="228" y="388" font-size="15" font-weight="600" fill="#111827">9 of 14 on</text><rect x="388" y="344" width="160" height="64" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="400" y="364" font-size="10.5" fill="#4b5563">Health</text><text x="400" y="388" font-size="15" font-weight="600" fill="#111827">All checks pass</text><rect x="560" y="344" width="160" height="64" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="572" y="364" font-size="10.5" fill="#4b5563">Site readiness</text><text x="572" y="388" font-size="15" font-weight="600" fill="#111827">7 of 9 done</text></g><g><text x="216" y="440" font-size="10.5" fill="#4b5563">The sidebar lists only the entries this person may open; an empty group is absent.</text><text x="216" y="458" font-size="10.5" fill="#4b5563">No theatre mark, no Tonight and no work queue: nothing here is a show-night or daily job.</text><text x="216" y="476" font-size="10.5" fill="#4b5563">The labelled strip stays in view at every width, so this is never mistaken for the console.</text><text x="216" y="494" font-size="10.5" fill="#4b5563">Below laptop width the sidebar is a drawer and the strip carries its toggle.</text><text x="216" y="512" font-size="10.5" fill="#4b5563">While a deploy&#x27;s database changes wait to be applied, this page is not shown:</text><text x="216" y="528" font-size="10.5" fill="#4b5563">the maintenance page is, with a link to Updates for an administrator.</text></g></svg>