<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-label="A settings page generated from what a module declares, with one unsaved change" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">A settings page, generated from what the module declares</text><g><rect x="24" y="44" width="712" height="336" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><rect x="24" y="44" width="110" height="336" fill="#f3f4f6" stroke="#d1d5db"></rect><rect x="34" y="56" width="14" height="14" fill="#6b7280"></rect><text x="34" y="98" fill="#111827">Tonight</text><text x="34" y="120" fill="#111827">Box office</text><text x="34" y="142" fill="#111827">Front of house</text><text x="34" y="164" fill="#111827">Money</text><rect x="30" y="173" width="98" height="20" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="40" y="187" font-weight="600" fill="#111827">Site settings</text></g><g><text x="150" y="72" font-size="15" font-weight="600" fill="#111827">Site settings</text><rect x="560" y="55" width="164" height="24" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="570" y="71" fill="#4b5563">Search settings</text><line x1="134" x2="736" y1="88" y2="88" stroke="#d1d5db"></line><text x="150" y="114" fill="#111827">Organisation</text><text x="150" y="136" fill="#111827">Branding</text><line x1="144" x2="144" y1="146" y2="164" stroke="#2563eb" stroke-width="2"></line><text x="150" y="158" font-weight="600" fill="#111827">Box office</text><text x="150" y="180" fill="#111827">Payments</text><text x="150" y="202" fill="#111827">Front of house</text><text x="150" y="224" fill="#111827">Interface</text><text x="150" y="256" fill="#111827">Modules</text><line x1="250" x2="250" y1="88" y2="340" stroke="#d1d5db"></line></g><g><text x="266" y="114" font-size="13" font-weight="600" fill="#111827">Holds and checkout</text><text x="266" y="142" font-weight="600" fill="#111827">Hold tickets for</text><text x="266" y="158" font-size="10.5" fill="#4b5563">How long a basket is kept while someone pays.</text><rect x="604" y="130" width="120" height="28" rx="6" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="614" y="148" fill="#111827">10 minutes</text><line x1="266" x2="724" y1="172" y2="172" stroke="#d1d5db"></line><text x="266" y="196" font-weight="600" fill="#111827">Buy without an account</text><text x="266" y="212" font-size="10.5" fill="#4b5563">Let people book as a guest with only an email.</text><rect x="680" y="186" width="44" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><circle cx="712" cy="197" r="7" fill="#2563eb"></circle><text x="670" y="201" text-anchor="end" fill="#111827">On</text><line x1="266" x2="724" y1="226" y2="226" stroke="#d1d5db"></line><text x="266" y="250" font-weight="600" fill="#111827">Stop online sales</text><text x="266" y="266" font-size="10.5" fill="#4b5563">Before the performance starts. The desk can still sell.</text><rect x="604" y="238" width="120" height="28" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="614" y="256" fill="#111827">30 minutes</text><text x="724" y="284" text-anchor="end" font-size="10.5" fill="#4b5563">Changed. Was 0 minutes.  Reset</text><line x1="266" x2="724" y1="296" y2="296" stroke="#d1d5db"></line><text x="266" y="320" font-size="10.5" fill="#4b5563">Each row shows its default, who last changed it, and a link to its help page.</text></g><g><rect x="134" y="340" width="602" height="40" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="150" y="364" fill="#111827">1 unsaved change</text><text x="586" y="364" text-anchor="end" fill="#111827">Discard</text><rect x="604" y="348" width="120" height="24" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="664" y="364" text-anchor="middle" font-weight="600" fill="#111827">Save changes</text></g></svg>