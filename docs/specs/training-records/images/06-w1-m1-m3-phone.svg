<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" role="img" aria-label="A member sees what needs doing first, then what they hold" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#111827">A member sees what needs doing first, then what they hold</text><g><rect x="24" y="48" width="340" height="580" rx="24" fill="none" stroke="#6b7280" stroke-width="1"></rect><line x1="24" y1="104" x2="364" y2="104" stroke="#d1d5db"></line><text x="40" y="83" font-size="15" font-weight="600" fill="#111827">Training</text><text x="348" y="83" font-size="11.5" text-anchor="end" fill="#4b5563">Lantern Theatre</text><line x1="24" y1="580" x2="364" y2="580" stroke="#d1d5db"></line></g><g><rect x="40" y="120" width="308" height="118" rx="8" fill="#d97706" stroke="#d97706" stroke-width="1" fill-opacity="0.10"></rect><text x="52" y="144" font-weight="600" fill="#111827">First aid expires in 20 days</text><text x="52" y="162" font-size="11.5" fill="#4b5563">On 14 December. Renew at the next session:</text><text x="52" y="177" font-size="11.5" fill="#4b5563">Thursday 3 December, 4 places left</text><rect x="52" y="188" width="284" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.12"></rect><text x="194" y="212.5" font-weight="600" text-anchor="middle" fill="#111827">Sign up</text></g><g><rect x="40" y="250" width="308" height="74" rx="8" fill="none" stroke="#6b7280" stroke-width="1"></rect><text x="52" y="274" font-weight="600" fill="#111827">You have a place</text><text x="52" y="292" font-size="11.5" fill="#4b5563">Till training, Thursday 26 November</text><text x="52" y="307" font-size="11.5" fill="#4b5563">18:00, Studio</text><text x="336" y="307" font-size="11.5" font-weight="600" text-anchor="end" fill="#2563eb">View</text></g><g><text x="40" y="354" font-weight="600" fill="#111827">What you hold</text><line x1="40" y1="368" x2="348" y2="368" stroke="#d1d5db"></line><text x="40" y="390" fill="#111827">Front of house induction</text><text x="40" y="408" font-size="11.5" fill="#4b5563">no expiry</text><rect x="287.9" y="381" width="60.1" height="19" rx="9.5" fill="#059669" stroke="#059669" stroke-width="1" fill-opacity="0.12"></rect><text x="295.9" y="395" font-size="11.5" fill="#111827">Current</text><line x1="40" y1="420" x2="348" y2="420" stroke="#d1d5db"></line><text x="40" y="442" fill="#111827">Till</text><text x="40" y="460" font-size="11.5" fill="#4b5563">1 of 4 steps signed off</text><rect x="262.7" y="433" width="85.3" height="19" rx="9.5" fill="#6b7280" stroke="#6b7280" stroke-width="1" fill-opacity="0.12"></rect><text x="270.7" y="447" font-size="11.5" fill="#111827">In progress</text><line x1="40" y1="472" x2="348" y2="472" stroke="#d1d5db"></line><text x="40" y="494" fill="#111827">First aid at work</text><text x="40" y="512" font-size="11.5" fill="#4b5563">until 14 December</text><rect x="256.4" y="485" width="91.6" height="19" rx="9.5" fill="#d97706" stroke="#d97706" stroke-width="1" fill-opacity="0.12"></rect><text x="264.4" y="499" font-size="11.5" fill="#111827">Expires soon</text><line x1="40" y1="524" x2="348" y2="524" stroke="#d1d5db"></line><text x="40" y="550" font-size="11.5" font-weight="600" fill="#2563eb">All courses</text></g><g><text x="66.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">Home</text><text x="151.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">Shifts</text><text x="236.5" y="609" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Training</text><rect x="218.5" y="581" width="36" height="3" fill="#2563eb"></rect><text x="321.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">More</text></g><g><rect x="396" y="48" width="340" height="580" rx="24" fill="none" stroke="#6b7280" stroke-width="1"></rect><line x1="396" y1="104" x2="736" y2="104" stroke="#d1d5db"></line><text x="412" y="72" font-size="11.5" fill="#4b5563">Courses</text><text x="412" y="92" font-size="15" font-weight="600" fill="#111827">Till</text><line x1="396" y1="580" x2="736" y2="580" stroke="#d1d5db"></line></g><g><rect x="412" y="120" width="308" height="58" rx="8" fill="#f3f4f6" stroke="none"></rect><text x="424" y="142" font-size="11.5" fill="#4b5563">Practical course, valid for 2 years</text><text x="424" y="164" font-size="11.5" fill="#4b5563">Your status</text><rect x="496" y="151" width="173.5" height="19" rx="9.5" fill="#6b7280" stroke="#6b7280" stroke-width="1" fill-opacity="0.12"></rect><text x="504" y="165" font-size="11.5" fill="#111827">In progress, 1 of 4 steps</text></g><g><text x="412" y="206" font-weight="600" fill="#111827">Steps</text><rect x="412" y="214" width="36" height="3" fill="#2563eb"></rect><text x="476" y="206" fill="#4b5563">Sessions</text><text x="556" y="206" fill="#4b5563">What changed</text><line x1="412" y1="217" x2="720" y2="217" stroke="#d1d5db"></line></g><g><text x="412" y="246" fill="#111827">1  Read the till guide</text><text x="430" y="264" font-size="11.5" fill="#4b5563">You confirmed this on 20 November</text><rect x="641" y="275" width="79" height="19" rx="9.5" fill="#059669" stroke="#059669" stroke-width="1" fill-opacity="0.12"></rect><text x="649" y="289" font-size="11.5" fill="#111827">Signed off</text><line x1="412" y1="302" x2="720" y2="302" stroke="#d1d5db"></line><text x="412" y="328" fill="#111827">2  Attend till training</text><text x="430" y="346" font-size="11.5" fill="#4b5563">Signed off when the trainer marks you here</text><rect x="672" y="357" width="47.5" height="19" rx="9.5" fill="#6b7280" stroke="#6b7280" stroke-width="1" fill-opacity="0.12"></rect><text x="680" y="371" font-size="11.5" fill="#111827">To do</text><line x1="412" y1="384" x2="720" y2="384" stroke="#d1d5db"></line><text x="412" y="410" font-size="11.5" font-weight="600" fill="#4b5563">Next session</text><text x="412" y="430" fill="#111827">Thursday 26 November, 18:00, Studio</text><text x="412" y="448" font-size="11.5" fill="#4b5563">3 places left</text><line x1="412" y1="464" x2="720" y2="464" stroke="#d1d5db"></line><text x="412" y="488" font-size="11.5" fill="#4b5563">Then 2 practical steps a trainer signs off</text></g><g><rect x="412" y="516" width="308" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.12"></rect><text x="566" y="540.5" font-weight="600" text-anchor="middle" fill="#111827">Sign up for a session</text></g><g><text x="438.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">Home</text><text x="523.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">Shifts</text><text x="608.5" y="609" font-size="11.5" font-weight="600" text-anchor="middle" fill="#111827">Training</text><rect x="590.5" y="581" width="36" height="3" fill="#2563eb"></rect><text x="693.5" y="609" font-size="11.5" text-anchor="middle" fill="#4b5563">More</text></g><text x="24" y="652" font-size="11.5" fill="#4b5563">M1 Training (left) and M3 A course (right), on a phone. One primary action each; every status badge carries a word.</text></svg>