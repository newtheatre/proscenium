<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="A course page shows its standing at a glance and edits steps in place" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#111827">A course page shows its standing at a glance and edits steps in place</text><g><rect x="24" y="48" width="712" height="386" rx="8" fill="none" stroke="#6b7280" stroke-width="1"></rect><line x1="174" y1="48" x2="174" y2="434" stroke="#d1d5db"></line><text x="40" y="76" font-weight="600" fill="#111827">Console</text><text x="40" y="104" font-size="11.5" font-weight="600" fill="#4b5563">Training</text><rect x="32" y="110" width="134" height="24" rx="6" fill="#f3f4f6"></rect><text x="40" y="126" font-size="11.5" font-weight="600" fill="#111827">Courses</text><text x="40" y="154" font-size="11.5" fill="#4b5563">Sessions</text><text x="40" y="182" font-size="11.5" fill="#4b5563">People</text><text x="40" y="210" font-size="11.5" fill="#4b5563">Evidence</text><text x="40" y="238" font-size="11.5" fill="#4b5563">Competencies</text><text x="40" y="266" font-size="11.5" fill="#4b5563">Settings</text></g><g><text x="190" y="72" font-size="11.5" fill="#4b5563">Training / Courses</text><text x="190" y="98" font-size="15" font-weight="600" fill="#111827">Till</text><rect x="222" y="84" width="41.2" height="19" rx="9.5" fill="#059669" stroke="#059669" stroke-width="1" fill-opacity="0.12"></rect><text x="230" y="98" font-size="11.5" fill="#111827">Live</text><rect x="618" y="76" width="102" height="32" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2" fill-opacity="0.12"></rect><text x="669" y="96.5" font-weight="600" text-anchor="middle" fill="#111827">Edit steps</text></g><g><rect x="190" y="114" width="530" height="52" rx="8" fill="#f3f4f6" stroke="none"></rect><text x="204" y="134" font-size="11.5" fill="#4b5563">Version</text><text x="204" y="154" font-weight="600" fill="#111827">3</text><text x="284" y="134" font-size="11.5" fill="#4b5563">Valid for</text><text x="284" y="154" font-weight="600" fill="#111827">2 years</text><text x="380" y="134" font-size="11.5" fill="#4b5563">Current holders</text><text x="380" y="154" font-weight="600" fill="#111827">38</text><text x="496" y="134" font-size="11.5" fill="#4b5563">Lapsing in 30 days</text><text x="496" y="154" font-weight="600" fill="#111827">4</text><text x="618" y="134" font-size="11.5" fill="#4b5563">Next session</text><text x="618" y="154" font-weight="600" fill="#111827">26 November</text></g><g><text x="190" y="194" font-weight="600" fill="#111827">Steps</text><rect x="190" y="202" width="36" height="3" fill="#2563eb"></rect><text x="252" y="194" fill="#4b5563">Versions</text><text x="334" y="194" fill="#4b5563">Sessions</text><text x="416" y="194" fill="#4b5563">People</text><text x="486" y="194" fill="#4b5563">Trainers</text><text x="566" y="194" fill="#4b5563">History</text><line x1="190" y1="205" x2="720" y2="205" stroke="#d1d5db"></line></g><g><text x="190" y="230" font-size="11.5" font-weight="600" fill="#4b5563">Step</text><text x="470" y="230" font-size="11.5" font-weight="600" fill="#4b5563">How it is signed off</text><text x="650" y="230" font-size="11.5" font-weight="600" fill="#4b5563">In renewal</text><line x1="190" y1="238" x2="720" y2="238" stroke="#d1d5db"></line><text x="190" y="262" fill="#111827">1  Read the till guide</text><text x="470" y="262" font-size="11.5" fill="#4b5563">The person confirms</text><text x="650" y="262" font-size="11.5" fill="#4b5563">Yes</text><line x1="190" y1="274" x2="720" y2="274" stroke="#d1d5db"></line><text x="190" y="296" fill="#111827">2  Attend till training</text><text x="470" y="296" font-size="11.5" fill="#4b5563">Attendance at a session</text><text x="650" y="296" font-size="11.5" fill="#4b5563">No</text><line x1="190" y1="308" x2="720" y2="308" stroke="#d1d5db"></line><text x="190" y="330" fill="#111827">3  Run a till with a trainer watching</text><text x="470" y="330" font-size="11.5" fill="#4b5563">A trainer, twice</text><text x="650" y="330" font-size="11.5" fill="#4b5563">Yes</text><line x1="190" y1="342" x2="720" y2="342" stroke="#d1d5db"></line><text x="190" y="364" fill="#111827">4  Cash up at close</text><text x="470" y="364" font-size="11.5" fill="#4b5563">A trainer, once</text><text x="650" y="364" font-size="11.5" fill="#4b5563">No</text><line x1="190" y1="376" x2="720" y2="376" stroke="#d1d5db"></line><text x="190" y="404" font-weight="600" fill="#2563eb">+ Add a step</text></g><text x="24" y="458" font-size="11.5" fill="#4b5563">K2 A course. Editing the steps of a live course starts version 4 in preparation; version 3 stays live until it is published.</text></svg>