<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" aria-label="W6. Joining takes a confirmed email; leaving takes one button" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">W6. Joining takes a confirmed email; leaving takes one button</text><path d="M248 170H268" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#pub-arrow)"></path><g><rect x="24" y="44" width="224" height="330" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="70" font-size="11.5" fill="#4b5563">Sign-up component</text><text x="40" y="94" font-weight="600" fill="#111827">Hear from us</text><rect x="40" y="104" width="192" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="123" fill="#4b5563">you@example.org</text><rect x="40" y="144" width="16" height="16" rx="3" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="64" y="157" fill="#111827">Season news</text><text x="64" y="173" font-size="11.5" fill="#4b5563">Yes, email me the season</text><text x="64" y="187" font-size="11.5" fill="#4b5563">news. I can stop any time.</text><rect x="40" y="200" width="16" height="16" rx="3" fill="none" stroke="#6b7280"></rect><text x="64" y="213" fill="#111827">Family shows</text><text x="64" y="229" font-size="11.5" fill="#4b5563">Yes, email me about shows</text><text x="64" y="243" font-size="11.5" fill="#4b5563">for families.</text><rect x="40" y="258" width="192" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="136" y="277" text-anchor="middle" font-weight="600" fill="#111827">Sign up</text><rect x="40" y="300" width="192" height="60" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="52" y="319" font-size="11.5" fill="#4b5563">Always answers:</text><text x="52" y="336" font-weight="600" fill="#111827">Check your email</text><text x="52" y="352" font-size="11.5" fill="#4b5563">known address or not</text></g><g><rect x="268" y="44" width="224" height="330" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="284" y="70" font-size="11.5" fill="#4b5563">/mailing/confirm, from the email</text><text x="284" y="94" font-weight="600" fill="#111827">Confirm your email</text><text x="284" y="118" fill="#111827">Press the button to join</text><text x="284" y="136" fill="#111827">Season news.</text><rect x="284" y="152" width="192" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="380" y="171" text-anchor="middle" font-weight="600" fill="#111827">Yes, sign me up</text><rect x="284" y="200" width="192" height="52" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="296" y="221" font-weight="600" fill="#111827">Done</text><text x="296" y="239" font-size="11.5" fill="#111827">You joined Season news.</text><text x="284" y="300" font-size="11.5" fill="#4b5563">An expired link offers to send</text><text x="284" y="316" font-size="11.5" fill="#4b5563">a new one. Confirming signs</text><text x="284" y="332" font-size="11.5" fill="#4b5563">nobody in.</text></g><g><rect x="512" y="44" width="224" height="330" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="528" y="70" font-size="11.5" fill="#4b5563">/mailing/manage, from the email</text><text x="528" y="94" font-weight="600" fill="#111827">Your mailings</text><text x="528" y="118" fill="#111827">Season news</text><rect x="528" y="128" width="192" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="624" y="147" text-anchor="middle" font-weight="600" fill="#111827">Leave this list</text><rect x="528" y="166" width="192" height="30" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="624" y="185" text-anchor="middle" fill="#111827">Stop all mailings</text><line x1="528" y1="208" x2="720" y2="208" stroke="#d1d5db"></line><text x="528" y="228" text-decoration="underline" fill="#111827">Email me a link to my lists</text><text x="528" y="244" font-size="11.5" fill="#4b5563">It works once, for 24 hours.</text><rect x="528" y="256" width="192" height="74" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="540" y="274" font-size="11.5" fill="#4b5563">After leaving:</text><text x="540" y="291" font-weight="600" fill="#111827">You left Season news</text><text x="540" y="307" font-size="11.5" fill="#4b5563">Left by mistake? Email me</text><text x="540" y="321" font-size="11.5" fill="#4b5563">a link to my lists</text><text x="528" y="348" font-size="11.5" fill="#4b5563">No name or address is shown.</text><text x="528" y="364" font-size="11.5" fill="#4b5563">Opening it changes nothing.</text></g></svg>