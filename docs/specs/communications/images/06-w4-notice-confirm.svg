<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="W4. A notice makes its sender state why it is not marketing" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">W4. A notice makes its sender state why it is not marketing</text><g><rect x="24" y="44" width="712" height="332" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="71" font-weight="600" fill="#111827">New notice, step 3 of 3: Confirm</text></g><g><text x="40" y="98" font-size="11.5" fill="#4b5563">Who</text><text x="40" y="117" fill="#111827">Ticket holders for a performance</text><text x="40" y="135" font-size="11.5" fill="#4b5563">Sample show, Sat 14 Mar 2026, 7.30pm</text><rect x="40" y="150" width="330" height="48" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="56" y="179" font-weight="600" fill="#111827">212 people will receive this</text><text x="40" y="222" font-size="11.5" fill="#4b5563">Reason</text><rect x="40" y="228" width="330" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="247" fill="#111827">Change of start time</text></g><g><rect x="390" y="90" width="330" height="170" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="406" y="112" font-size="11.5" fill="#4b5563">Subject</text><text x="406" y="131" font-weight="600" fill="#111827">Tonight: doors open an hour late</text><rect x="406" y="144" width="290" height="6" rx="3" fill="#d1d5db"></rect><rect x="406" y="156" width="250" height="6" rx="3" fill="#d1d5db"></rect><rect x="406" y="168" width="270" height="6" rx="3" fill="#d1d5db"></rect><rect x="406" y="184" width="130" height="26" rx="6" fill="none" stroke="#6b7280"></rect><text x="471" y="201" text-anchor="middle" font-size="11.5" fill="#111827">See the new time</text><text x="406" y="234" font-size="11.5" fill="#4b5563">No production card or performance list:</text><text x="406" y="250" font-size="11.5" fill="#4b5563">promotional blocks are not offered.</text></g><g><rect x="40" y="280" width="16" height="16" rx="3" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="66" y="292" fill="#111827">This message is about something these people have booked or signed up for.</text><text x="66" y="310" fill="#111827">It does not promote anything.</text></g><g><text x="40" y="351" font-size="11.5" fill="#4b5563">A notice ignores quiet hours and cannot be muted.</text><rect x="500" y="332" width="70" height="30" rx="6" fill="none" stroke="#6b7280"></rect><text x="535" y="351" text-anchor="middle" font-size="12" fill="#111827">Back</text><rect x="580" y="332" width="140" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="650" y="351" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Send to 212 people</text></g></svg>