<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-label="W3. Sending shows counts, never names, and the button states the number" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">W3. Sending shows counts, never names, and the button states the number</text><g><rect x="24" y="44" width="348" height="380" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="71" font-weight="600" fill="#111827">Step 1 of 3: Audience</text><text x="40" y="96" font-size="11.5" fill="#4b5563">List</text><rect x="40" y="102" width="316" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="121" fill="#111827">Season news</text><text x="346" y="121" text-anchor="end" font-size="11.5" fill="#4b5563">audience, by consent</text><text x="40" y="152" font-size="11.5" fill="#4b5563">Narrow to</text><rect x="40" y="158" width="316" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="177" fill="#111827">Bought in the last two years</text><text x="40" y="208" font-size="11.5" fill="#4b5563">Leave out</text><rect x="40" y="214" width="316" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="233" fill="#111827">Ticket holders for a performance</text><text x="40" y="262" font-size="11.5" fill="#111827">+ Add a row</text><rect x="40" y="274" width="316" height="100" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="52" y="296" fill="#111827">On the list</text><text x="344" y="296" text-anchor="end" fill="#111827">1,480</text><text x="52" y="316" fill="#111827">After narrowing</text><text x="344" y="316" text-anchor="end" fill="#111827">1,262</text><text x="52" y="336" fill="#111827">Cannot be reached</text><text x="344" y="336" text-anchor="end" fill="#111827">58</text><line x1="52" y1="344" x2="344" y2="344" stroke="#6b7280"></line><text x="52" y="362" font-weight="600" fill="#111827">Will receive</text><text x="344" y="362" text-anchor="end" font-weight="600" fill="#111827">1,204</text><rect x="266" y="384" width="90" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="311" y="403" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Continue</text></g><g><rect x="388" y="44" width="348" height="380" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="404" y="71" font-weight="600" fill="#111827">Step 3 of 3: When</text><circle cx="412" cy="98" r="6" fill="none" stroke="#6b7280" stroke-width="1.25"></circle><text x="426" y="102" fill="#111827">Send now</text><circle cx="412" cy="126" r="6" fill="none" stroke="#2563eb" stroke-width="1.25"></circle><circle cx="412" cy="126" r="3" fill="#2563eb"></circle><text x="426" y="130" fill="#111827">Send later</text><rect x="426" y="142" width="150" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="436" y="161" fill="#111827">Tue 3 Mar 2026</text><rect x="586" y="142" width="80" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="596" y="161" fill="#111827">22:30</text><text x="426" y="188" font-size="11.5" fill="#4b5563">Times are in the theatre time zone</text><rect x="404" y="202" width="316" height="46" rx="5" fill="#d97706" fill-opacity="0.12" stroke="#d97706"></rect><text x="416" y="221" font-size="11.5" fill="#111827">22:30 falls in quiet hours, so this mailing will</text><text x="416" y="237" font-size="11.5" fill="#111827">start when they end.</text><rect x="404" y="262" width="316" height="74" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="416" y="283" fill="#111827">To: Season news, a consent list</text><text x="416" y="303" font-size="11.5" fill="#4b5563">Reason line: You are receiving this because</text><text x="416" y="319" font-size="11.5" fill="#4b5563">you joined Season news.</text><rect x="404" y="350" width="316" height="36" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="562" y="373" text-anchor="middle" font-weight="600" fill="#111827">Send to 1,204 people</text><text x="562" y="406" text-anchor="middle" font-size="11.5" fill="#4b5563">With approval on, this reads: Ask for approval</text></g></svg>