<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="W1. A mailing is written beside its real preview" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">W1. A mailing is written beside its real preview</text><g><rect x="24" y="44" width="712" height="404" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><line x1="24" y1="88" x2="736" y2="88" stroke="#d1d5db"></line><text x="40" y="71" font-size="11.5" fill="#4b5563">Mailings / Spring season announcement</text><rect x="664" y="56" width="56" height="22" rx="11" fill="none" stroke="#6b7280"></rect><text x="692" y="71" text-anchor="middle" font-size="11.5" fill="#111827">Draft</text></g><g><text x="40" y="108" font-size="11.5" fill="#4b5563">Subject</text><rect x="40" y="114" width="330" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="133" fill="#111827">Our spring season is on sale</text><text x="40" y="160" font-size="11.5" fill="#4b5563">Preheader</text><rect x="40" y="166" width="330" height="28" rx="5" fill="none" stroke="#6b7280"></rect><text x="50" y="185" fill="#111827">Six new shows from February</text><text x="40" y="213" font-size="11.5" fill="#4b5563">Body, in markdown</text><rect x="300" y="198" width="70" height="20" rx="6" fill="none" stroke="#6b7280"></rect><text x="335" y="212" text-anchor="middle" font-size="11.5" fill="#111827">+ Block</text><rect x="40" y="222" width="330" height="148" rx="5" fill="none" stroke="#6b7280"></rect><text x="52" y="244" fill="#111827">## Our spring season</text><rect x="52" y="254" width="290" height="6" rx="3" fill="#d1d5db"></rect><rect x="52" y="266" width="240" height="6" rx="3" fill="#d1d5db"></rect><rect x="52" y="280" width="306" height="26" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="62" y="297" font-size="11.5" fill="#111827">Block: production card</text><rect x="52" y="316" width="290" height="6" rx="3" fill="#d1d5db"></rect><rect x="52" y="330" width="306" height="26" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><text x="62" y="347" font-size="11.5" fill="#111827">Block: button, See the season</text></g><g><rect x="40" y="380" width="330" height="56" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><circle cx="54" cy="394" r="4" fill="#059669"></circle><text x="64" y="398" font-size="11.5" fill="#111827">Subject and body render</text><circle cx="54" cy="410" r="4" fill="#059669"></circle><text x="64" y="414" font-size="11.5" fill="#111827">The list is active and has a wording</text><circle cx="54" cy="426" r="4" fill="#dc2626"></circle><text x="64" y="430" font-size="11.5" fill="#111827">Fails: one image has no alt text. Show me</text></g><g><rect x="390" y="98" width="198" height="24" rx="6" fill="none" stroke="#6b7280"></rect><rect x="390" y="98" width="66" height="24" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb"></rect><line x1="522" y1="98" x2="522" y2="122" stroke="#6b7280"></line><text x="423" y="114" text-anchor="middle" font-size="11.5" fill="#111827">Email</text><text x="489" y="114" text-anchor="middle" font-size="11.5" fill="#111827">Plain text</text><text x="555" y="114" text-anchor="middle" font-size="11.5" fill="#111827">Inbox</text><rect x="640" y="98" width="80" height="24" rx="6" fill="none" stroke="#6b7280"></rect><line x1="680" y1="98" x2="680" y2="122" stroke="#6b7280"></line><text x="660" y="114" text-anchor="middle" font-size="11.5" fill="#111827">Light</text><text x="700" y="114" text-anchor="middle" font-size="11.5" fill="#111827">Dark</text><rect x="390" y="130" width="330" height="250" rx="5" fill="#f3f4f6" stroke="#d1d5db"></rect><rect x="410" y="144" width="290" height="36" rx="4" fill="#d1d5db"></rect><text x="555" y="166" text-anchor="middle" font-size="11.5" fill="#4b5563">Theatre header image</text><text x="410" y="202" font-weight="600" fill="#11182