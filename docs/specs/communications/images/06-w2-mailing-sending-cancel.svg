<svg font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-label="W2. A mailing in flight shows progress and what cannot be recalled" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#111827">W2. A mailing in flight shows progress and what cannot be recalled</text><g><rect x="24" y="44" width="712" height="300" rx="10" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text x="40" y="71" font-size="11.5" fill="#4b5563">Mailings / Spring season announcement</text><rect x="652" y="56" width="68" height="22" rx="11" fill="none" stroke="#6b7280"></rect><text x="686" y="71" text-anchor="middle" font-size="11.5" fill="#111827">Sending</text></g><g><line x1="24" y1="114" x2="736" y2="114" stroke="#d1d5db"></line><line x1="40" y1="113" x2="100" y2="113" stroke="#2563eb" stroke-width="2"></line><text x="40" y="104" font-weight="600" fill="#111827">Overview</text><text x="120" y="104" fill="#4b5563">Content</text><text x="190" y="104" fill="#4b5563">Results</text><text x="258" y="104" fill="#4b5563">Recipients</text></g><g><text x="40" y="150" font-size="15" font-weight="600" fill="#111827">820 of 1,204 handed over</text><rect x="40" y="162" width="440" height="12" rx="6" fill="#d1d5db"></rect><rect x="40" y="162" width="300" height="12" rx="6" fill="#2563eb"></rect><text x="40" y="194" font-size="11.5" fill="#4b5563">Tranche 9 of 13. The next starts in under a minute.</text><rect x="520" y="142" width="90" height="30" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="565" y="161" text-anchor="middle" font-size="12" fill="#111827">Pause</text><rect x="620" y="142" width="100" height="30" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="670" y="161" text-anchor="middle" font-size="12" fill="#111827">Cancel</text></g><g><rect x="40" y="214" width="680" height="112" rx="8" fill="#f3f4f6" stroke="#6b7280"></rect><text x="56" y="238" font-weight="600" fill="#111827">Cancel this mailing?</text><text x="56" y="260" fill="#111827">820 people have already been handed over and cannot be recalled. 384 will not receive it.</text><rect x="56" y="280" width="300" height="30" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="206" y="299" text-anchor="middle" font-size="12" fill="#111827">Copy to a new mailing for those not reached</text><rect x="366" y="280" width="130" height="30" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="431" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Cancel the rest</text><rect x="506" y="280" width="110" height="30" rx="6" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1"></rect><text x="561" y="299" text-anchor="middle" font-size="12" fill="#111827">Keep sending</text></g></svg>